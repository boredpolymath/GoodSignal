name: Feature request
description: Suggest an improvement to Good Signal.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need or situation behind your suggestion.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the behavior or change you have in mind.
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Privacy, accessibility, or offline considerations
      description: Note any effects this could have on local data, device permissions, accessibility, or offline use.
