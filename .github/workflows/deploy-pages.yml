name: Deploy Good Signal to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare app files
        run: |
          mkdir -p site-build
          cp app.js apple-touch-icon.png guide-catalog.json icon-192.png icon-512.png icon.svg index.html manifest.webmanifest style.css sw.js site-build/

      - name: Upload app files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
